---
settings:
  commit:
    format: "<%- prefix %>: <%- subject %>"
    prefix: "chore"
    subject: "sync files from `<%- repository %>`"
  pull_request:
    reviewers:
      - "shmileee"
    labels:
      - "auto-sync"
    title: "chore: sync files from `<%- repository %>`"
    merge:
      mode: auto
      strategy: squash
      delete_branch: true

patterns:
  - files:
      - .markdownlintrc
      - .github/renovate.json
      - .github/CODEOWNERS
    template:
      organization:
        name: "DevOps Roast"
        name_normalized: "devops-roast"
        url: "https://devops-roast.com"
        contact_email: "contact@devops-roast.com"
    repositories:
      - devops-roast/.github
      - devops-roast/containers
      - devops-roast/github-actions
      - devops-roast/pre-commit-hooks
      - devops-roast/renovate-config
      - devops-roast/website

  # readme-weaver subscribers: repositories whose README embeds partials from
  # `common-markdown/` with `<!-- md:include start path="<file>.md" -->` and
  # `<!-- md:include end -->` markers (paths are relative to
  # `common-markdown/`). To subscribe a repository, add the markers to its
  # README and list it here. Whenever a partial changes, the
  # readme-weaver-distribute workflow opens a pull request in every repository
  # listed here. This repository maintains its own README through the
  # readme-weaver pre-commit hook instead.
  - files:
      - from: .github/files-sync/workflows/readme-weaver.yaml
        to: .github/workflows/readme-weaver.yaml
    repositories:
      - devops-roast/pre-commit-hooks
